<script>/* Layout mode, one definition. html.duo-inner when the layout viewport's short side is at least 520 (the Duo inner
   screen; every slab phone tops out near 440). Wider than tall adds html.L-duo (two panes), otherwise html.L-innerp (inner
   portrait). Anything else is the phone layout (the Counter in short landscape, app6). The device screen is not used:
   Safari on the real Duo reports the wrong one. Re-checked on resize, orientationchange and unfold (and, v0.1.4.2, as the page settles after start); frozen while a text
   field has focus and for 700ms after, so a keyboard never flips it. window.LAYOUT.matches is true for every layout but
   two panes (the old cover query), with change listeners. */
(function () { var h = document.documentElement, hold = 0, ls = [], cur = null;
  var entry = function () { var a = document.activeElement; return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !/^(button|checkbox|radio|file|submit|reset|range|color)$/i.test(a.type))); };
  /* v0.1.4.3: the mode comes from media queries, which measure the viewport the CSS lays out with. window.innerWidth and
     innerHeight can disagree with it on a Home Screen app (the owner's cover screen in landscape laid out 678 wide yet
     never got the Counter), and a query's change event fires even when no resize does. */
  var mq = function (q) { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };
  var MQ_IN = mq("(min-width: 520px) and (min-height: 520px)"), MQ_LAND = mq("(orientation: landscape)");
  var want = function () { var w = window.innerWidth, ht = window.innerHeight; /* w and ht only for gate-slab's rule mutations */ /*WANT*/return MQ_IN.matches ? (MQ_LAND.matches ? "duo" : "innerp") : "phone";/*END*/ };
  var apply = function (m) { cur = m; h.classList.toggle("duo-inner", m !== "phone"); h.classList.toggle("L-duo", m === "duo"); h.classList.toggle("L-innerp", m === "innerp"); };
  var sync = function () { if (entry() || performance.now() < hold) return; var m = want(); if (m === cur) return; apply(m); ls.forEach(function (f) { try { f({ matches: m !== "duo" }); } catch (e) { setTimeout(function () { throw e; }); } }); };
  apply(want());
  window.addEventListener("resize", sync); window.addEventListener("orientationchange", sync);
  [MQ_IN, MQ_LAND].forEach(function (o) { try { if (o.addEventListener) o.addEventListener("change", sync); else o.addListener(sync); } catch (e) {} });
  document.addEventListener("focusout", function () { hold = performance.now() + 700; setTimeout(sync, 720); }, true);
  /* v0.1.4.2: a Home Screen launch can read a stale viewport for a moment and fire no resize after it settles, which
     left the phone layout up until focus next moved (the first focusout re-check then flipped the home mid-visit).
     Re-check as the page settles: load, pageshow, visibility, the visual viewport, and a short poll after start. */
  /* v0.1.4.3: the settle checks re-checked only these classes, so every other resize-only layout (the Counter on the
     cover screen in landscape) kept the stale viewport's answer. When the viewport has changed with no resize event,
     fire the resize the browser skipped, so every layout that listens for one re-checks. */
  var lw = window.innerWidth, lh = window.innerHeight;
  window.addEventListener("resize", function () { lw = window.innerWidth; lh = window.innerHeight; }, true);
  var settle = function () { if (window.innerWidth !== lw || window.innerHeight !== lh) { lw = window.innerWidth; lh = window.innerHeight; try { window.dispatchEvent(new Event("resize")); } catch (e) {} } sync(); };
  window.addEventListener("load", settle); window.addEventListener("pageshow", settle);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) settle(); });
  try { if (window.visualViewport) window.visualViewport.addEventListener("resize", settle); } catch (e) {}
  [50, 150, 300, 600, 1000, 1600, 2500].forEach(function (t) { setTimeout(settle, t); });
  window.LAYOUT = { get matches() { return cur !== "duo"; }, get mode() { return cur; }, sync: sync,
    addEventListener: function (t, f) { ls.push(f); }, addListener: function (f) { ls.push(f); } };
})();</script>
