name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Please don't post your plan, plan link or code, exports, backups, or any personal or health data."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal, health, and plan data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could the tracker help?
    validations:
      required: true
