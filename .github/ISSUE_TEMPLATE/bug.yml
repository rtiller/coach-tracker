name: Bug report
description: Something in the tracker does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please don't post your plan, plan link or code, exports, backups, or any personal or health data. Describe the problem in your own words."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal, health, and plan data.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of More, About and your data (for example v0.1.3.4-preview).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example "iPhone 15, Safari 18" or "folding phone, Chrome 130".
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Screen mode
      options:
        - Phone or cover screen, portrait
        - Cover screen, landscape
        - Inner screen, portrait
        - Inner screen, landscape (two panes)
        - Tablet or desktop
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
